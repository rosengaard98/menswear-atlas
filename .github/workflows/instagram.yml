name: Post to Instagram

# The nightly run opens an issue labelled "instagram" with the night's draft post.
# Adding the "approve" label (only people with write access can) publishes it.
on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: instagram-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.label.name == 'approve' && contains(github.event.issue.labels.*.name, 'instagram')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/publish-instagram.mjs
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          GITHUB_TOKEN: ${{ github.token }}
